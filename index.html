<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>e4e5 · memo mockup</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard-jp@1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.css">
<style>
/* pure palette: only #fff and #000. no grays anywhere. */
:root{--bg:#fff;--fg:#000;--sans:"Pretendard JP Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;--iw:310px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff}}
:root[data-theme=dark]{--bg:#000;--fg:#fff}
*{box-sizing:border-box;border-radius:0;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.5 var(--sans);letter-spacing:-.03em;-webkit-font-smoothing:antialiased}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
::selection{background:var(--fg);color:var(--bg)}
a{color:inherit;text-decoration:none}

/* ---- site shell ---- */
.shell{display:grid;grid-template-columns:var(--iw) minmax(0,1fr);gap:0 22px;padding:0 16px}
.side{position:sticky;top:0;height:100svh;padding:12px 0}
.im{position:relative;height:100%;border:1px solid var(--fg);overflow:hidden;
 background:conic-gradient(var(--fg) 25%,var(--bg) 0 50%,var(--fg) 0 75%,var(--bg) 0) 0 0/64px 64px}
.im::after{content:"IMAGE";position:absolute;left:8px;bottom:8px;background:var(--bg);color:var(--fg);border:1px solid var(--fg);font:700 10px var(--sans);letter-spacing:.14em;padding:2px 9px}
.col{min-width:0;display:flex;flex-direction:column;min-height:100svh}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;height:44px;border-bottom:1px solid var(--fg)}
nav{display:flex;gap:9px;font:500 12.5px var(--sans)}
nav a{display:inline-flex;flex-direction:column}nav a::after{content:attr(data-t);font-weight:700;height:0;overflow:hidden;visibility:hidden}
nav a{opacity:1}nav a:not(.on){font-weight:400;text-decoration:none}nav a:not(.on):hover{text-decoration:underline;text-underline-offset:3px}
nav a.on{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.hr{display:flex;align-items:center}
.hp{width:20px;height:44px;display:grid;place-items:center;font:800 17px var(--sans)}
.hp svg{width:18px;height:18px;fill:currentColor}
.ib{display:grid;place-items:center;min-width:30px;height:30px}
.bd{position:relative;display:block;width:15px;height:15px;border:1px solid currentColor;transition:transform .35s cubic-bezier(.6,0,.2,1)}
.bd i{position:absolute;width:6.5px;height:6.5px;background:currentColor}.bd i:first-child{left:0;top:0}.bd i:last-child{right:0;bottom:0}
[data-theme=dark] .bd{transform:rotate(90deg)}
main{flex:1;padding:14px 0 36px}
footer{border-top:1px solid var(--fg);padding:10px 0 64px;font:500 10.5px var(--sans);display:flex;justify-content:flex-end;gap:8px}

/* search + tags (same as site) */
.sbx{position:relative;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--fg);margin:0 0 10px}
.sbx input{flex:1;min-width:0;padding:9px 0;border:0;background:none;outline:0;font:500 13px var(--sans)}
.sbx input::placeholder{color:var(--fg);opacity:1}
.sct{font:700 11px var(--sans);white-space:nowrap}
.tgbar{display:flex;flex-wrap:wrap;margin:9px 0 6px}
.chip{font:700 11px/1.5 var(--sans);letter-spacing:.04em;cursor:pointer}
.chip+.chip::before{content:"/";margin:0 5px;font-weight:400}
.chip:not(.on){font-weight:500}.chip.on{font-weight:900;text-decoration:underline;text-underline-offset:3px}
.chip:hover{text-decoration:underline;text-underline-offset:3px}

/* ---- memo desk (draggable sheets) ---- */
.mdk{position:relative;margin-top:6px;min-height:560px}
.msh{position:absolute;width:var(--sw,240px);max-height:300px;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);transform:rotate(var(--r,0deg));cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:box-shadow .15s,transform .15s}
.msh.dragging{cursor:grabbing;transform:rotate(0)!important;transition:none;touch-action:none}
.msh.hide{display:none}
.mshi{position:relative;padding:12px 14px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.mno{display:block;font:700 9px var(--sans);letter-spacing:.12em}
.mst{display:block;font:800 16px/1.25 var(--sans);letter-spacing:-.045em;margin:4px 0 5px;word-break:break-word}
.mtw{position:relative}
.mt{position:relative;margin:0;font-size:13px;line-height:1.55;word-break:break-word;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:8;line-clamp:8;overflow:hidden}
.rl{display:none}
.msf{margin-top:8px;padding-top:5px;border-top:1px dashed var(--fg);font:600 10.5px/1.35 var(--sans)}
.msf span{margin-right:6px}
.msh.inv{background:var(--fg);color:var(--bg)}
.msh.inv .msf{border-top-color:var(--bg)}

/* shadows on black sheets: white gap + thin black edge so they never melt into the page */
/* ORIGINAL (pure) */
.v-o .msh{border:2px solid var(--fg);box-shadow:5px 5px 0 var(--fg)}
.v-o .msh.inv{box-shadow:4px 4px 0 var(--bg),6px 6px 0 var(--fg)}
.v-o .msh:hover{box-shadow:7px 7px 0 var(--fg)}
.v-o .msh.inv:hover{box-shadow:5px 5px 0 var(--bg),7px 7px 0 var(--fg)}

/* A · INDEX CARD */
.v-a .msh{border:1px solid var(--fg);transform:rotate(calc(var(--r)*.6))}
.v-a .msh:hover{box-shadow:4px 4px 0 var(--fg);transform:rotate(0)}.v-a .msh.inv:hover{box-shadow:3px 3px 0 var(--bg),4px 4px 0 var(--fg)}
.v-a .msh.inv{outline:0}
.v-a .mshi{padding:0}
.v-a .mno{padding:5px 12px;border-bottom:1px solid currentColor;display:flex;justify-content:space-between;align-items:center}
.v-a .mno::after{content:"";width:8px;height:8px;background:currentColor}
.v-a .mst{margin:0;padding:9px 12px 8px;border-bottom:2px solid currentColor;font-size:15px}
.v-a .mtw{padding:0 12px}
.v-a .mt,.v-a .rl{line-height:22px}
.v-a .rl{display:block;position:absolute;left:12px;right:12px;top:0;bottom:0;background:linear-gradient(transparent 21px,currentColor 21px) 0 0/100% 22px;
 -webkit-mask:linear-gradient(90deg,#000 1px,transparent 1px) 0 0/4px 100%;mask:linear-gradient(90deg,#000 1px,transparent 1px) 0 0/4px 100%}
.v-a .msf{margin:0;padding:6px 12px;border-top:1px solid currentColor}

/* B · BOARD PAPER */
.v-b .msh{border:2px solid var(--fg);transform:rotate(calc(var(--r)*.45));box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 6px var(--fg),5px 5px 0 var(--fg)}
.v-b .msh.inv{box-shadow:inset 0 0 0 5px var(--fg),inset 0 0 0 6px var(--bg),4px 4px 0 var(--bg),6px 6px 0 var(--fg)}
.v-b .msh:hover{box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 6px var(--fg),8px 8px 0 var(--fg)}
.v-b .msh.inv:hover{box-shadow:inset 0 0 0 5px var(--fg),inset 0 0 0 6px var(--bg),6px 6px 0 var(--bg),8px 8px 0 var(--fg)}
.v-b .mshi{padding:20px 20px 16px}
.v-b .msh::before{content:"";position:absolute;right:-2px;top:-2px;width:24px;height:24px;z-index:2;border:2px solid var(--fg);background:conic-gradient(var(--fg) 25%,var(--bg) 0 50%,var(--fg) 0 75%,var(--bg) 0)}
.v-b .msh.inv::before{background:conic-gradient(var(--bg) 25%,var(--fg) 0 50%,var(--bg) 0 75%,var(--fg) 0)}
.v-b .mt{line-height:1.6}

/* C · FOLDED LABEL */
.v-c .msh{border:2px solid var(--fg);box-shadow:6px 6px 0 var(--fg);margin-top:10px;--r:0deg!important}
.v-c .msh.inv{box-shadow:5px 5px 0 var(--bg),7px 7px 0 var(--fg)}
.v-c .msh:hover{box-shadow:9px 9px 0 var(--fg)}.v-c .msh.inv:hover{box-shadow:7px 7px 0 var(--bg),9px 9px 0 var(--fg)}
.v-c .msh::after{content:"";position:absolute;right:-2px;top:-2px;width:26px;height:26px;z-index:2;background:linear-gradient(225deg,var(--bg) 50%,var(--fg) 50%)}
.v-c .msh.inv::after{background:linear-gradient(225deg,var(--bg) 50%,transparent 50%);box-shadow:none}
.v-c .mshi{padding:20px 14px 12px}
.v-c .mno{position:absolute;left:-2px;top:-11px;z-index:3;background:var(--fg);color:var(--bg);padding:1px 9px;border:2px solid var(--fg)}
.v-c .msh.inv .mno{background:var(--bg);color:var(--fg)}
.v-c .mst{font-size:17px}

/* D · SCORESHEET */
.v-d .msh{border:2px solid var(--fg);box-shadow:4px 4px 0 var(--fg);--r:0deg!important}
.v-d .msh.inv{box-shadow:3px 3px 0 var(--bg),5px 5px 0 var(--fg)}
.v-d .msh:hover{box-shadow:6px 6px 0 var(--fg)}.v-d .msh.inv:hover{box-shadow:5px 5px 0 var(--bg),7px 7px 0 var(--fg)}
.v-d .mshi{padding:12px 12px 10px 42px}
.v-d .mshi::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:3px;border-left:1px solid currentColor;border-right:1px solid currentColor}
.v-d .mshi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;opacity:0}
.v-d .msh.inv .mshi::after{opacity:1;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--bg) 5px 6px)}
.v-d .mno::before{content:"";position:absolute;left:10px;top:14px;width:9px;height:9px;border:1.5px solid currentColor}
.v-d .mt,.v-d .rl{line-height:22px}
.v-d .mtw{margin-left:0}
.v-d .rl{display:block;position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(transparent 21px,currentColor 21px) 0 0/100% 22px;
 -webkit-mask:linear-gradient(90deg,#000 1px,transparent 1px) 0 0/4px 100%;mask:linear-gradient(90deg,#000 1px,transparent 1px) 0 0/4px 100%}
.v-d .mst{margin:2px 0 4px;line-height:22px;font-size:15px}
.v-d .msf{border-top:0;padding-top:0;margin-top:4px}

/* ---- reading sheet (click) ---- */
.mov{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;background:var(--bg);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(2px)}
.mwr{position:relative;width:min(560px,100%);animation:mp .25s cubic-bezier(.3,.8,.2,1) both}
@keyframes mp{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.mwr .msheet{background:var(--bg);color:var(--fg);border:2px solid var(--fg);box-shadow:9px 9px 0 var(--fg);max-height:82dvh;overflow:auto;padding:22px 46px 22px 24px;user-select:text}
.mov.inv .msheet{background:var(--fg);color:var(--bg);box-shadow:7px 7px 0 var(--bg),9px 9px 0 var(--fg)}
.msheet .mno{margin-bottom:4px}.msheet .mst{font-size:24px;margin:2px 0 10px}.msheet p{margin:0 0 11px;line-height:1.7;font-size:14px}
.msheet .msf{margin-top:14px;font-size:11px}.mov.inv .msf{border-top-color:var(--bg)}
.mcls{position:absolute;right:12px;top:12px;z-index:6;width:30px;height:30px;display:grid;place-items:center;color:var(--fg)}
.mov.inv .mcls{color:var(--bg)}
.mcls svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.5;fill:none}

/* ---- mockup switcher (not part of the site) ---- */
.sw{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:900;display:flex;align-items:stretch;border:1px solid var(--fg);background:var(--bg);max-width:calc(100vw - 16px);overflow-x:auto}
.sw b{display:grid;place-items:center;padding:0 10px;background:var(--fg);color:var(--bg);font:800 9px var(--sans);letter-spacing:.14em;white-space:nowrap}
.sw button{padding:7px 12px;font:700 11px var(--sans);letter-spacing:.06em;white-space:nowrap;border-left:1px solid var(--fg)}
.sw button:hover{text-decoration:underline;text-underline-offset:3px}
.sw button.on{background:var(--fg);color:var(--bg)}
.vd{margin:0 0 4px;font:700 10px var(--sans);letter-spacing:.14em}

@media(max-width:1024px){:root{--iw:170px}}
@media(max-width:720px){.shell{display:block}.side{position:static;height:128px;padding:10px 0 0}.col{min-height:0}}
</style>
</head>
<body>
<div class="shell">
 <aside class="side"><div class="im"></div></aside>
 <div class="col">
  <header>
   <nav><a href="#" data-t="check">check</a><a href="#" data-t="e4">e4</a><a href="#" data-t="e5">e5</a><a href="#" class="on" data-t="f4">f4</a><a href="#" data-t="exf4">exf4</a><a href="#" data-t="?!">?!</a></nav>
   <span class="hr"><span class="hp">#</span><span class="hp"><svg viewBox="0 0 16 16"><path d="M8.8 1.2L3.6 8.8h3.9l-1 5.8 5.9-7.7H8.6z"/></svg></span><button class="ib" id="theme" aria-label="theme"><span class="bd"><i></i><i></i></span></button></span>
  </header>
  <main>
   <div class="sbx"><input id="sq" placeholder="search" autocomplete="off"><span class="sct" id="sct"></span></div>
   <div class="tgbar" id="tg"></div>
   <p class="vd" id="vd"></p>
   <div class="mdk v-a" id="mdk"></div>
  </main>
  <footer><button>checkmate</button></footer>
 </div>
</div>
<div class="sw" id="sw"><b>MOCKUP</b></div>

<script>
const M=[
 ['체스 오프닝 정리','킹스 갬빗 어셉티드에서 3…g5 이후 라인 정리. 4.h4 g4 5.Ng5 h6 6.Nxf7 Kxf7 — 이 구간만큼은 외워둘 것. 흰색이 먼저 던지는 쪽이 재밌다.',['chess','opening']],
 ['장보기','우유, 계란, 식빵, 올리브유, 건전지 AAA.',['todo']],
 ['링크 사이트 시안','블랙/화이트 고정, 각진 모서리, 자동 라이트·다크. 배너는 흑백이었다가 호버하면 컬러로.',['design']],
 ['','오늘 뭐 먹지 고민하다 하루가 다 감. 결론: 김밥.',['daily']],
 ['폰트 메모','본문 Pretendard, 명조는 KoPub Batang, 모노는 Orbit. 자간은 -0.03em가 제일 안정적. 제목은 800 이상으로 올리고 본문은 400으로 내리면 대비가 확실하다.',['design','font']],
 ['카드 템플릿','뉴모피즘 카드 / 헤더 이미지 비율 3:2 / 이름 + 한 줄 소개 + 태그 세 개까지만. 너무 많이 넣으면 답답함.',['card','design']],
 ['','새벽에 갑자기 생각난 것: 메모를 체스 말처럼 칸에 올려두면 어떨까. 한 칸에 하나, 클릭하면 크게 열리고.',['idea']],
 ['퍼즐 기록','Mate in 2 / 룩 희생 후 퀸으로 마무리. 힌트 없이 풀었음. 다음엔 Mate in 3.',['chess','puzzle']],
 ['메모','끌어서 옮기고, 눌러서 읽기.',['idea']]
];
const R=[-3.2,2.1,-1.4,3,-2.4,1.2,2.8,-1.8,-2.6];
const V={o:'ORIGINAL',a:'A',b:'B',c:'C',d:'D'};
const VD={o:'ORIGINAL · 지금 디자인을 순수 #fff / #000으로만 바꾼 버전',a:'A · INDEX CARD · 기울기 없음, 번호 윗띠, 점선 괘선',b:'B · BOARD PAPER · 이중 테두리 + 체스판 모서리',c:'C · FOLDED LABEL · 접힌 모서리 + 번호 라벨',d:'D · SCORESHEET · 여백선 + 점선 괘선 + 펀치홀'};
const $=s=>document.querySelector(s),desk=$('#mdk');
let cur='a',POS={},TAG='',Q='',Z=60;
const tags=[...new Set(M.flatMap(m=>m[2]))].sort();
desk.innerHTML=M.map((m,i)=>`<div class="msh${i%2?' inv':''}" data-i="${i}" style="--r:${R[i]}deg"><div class="mshi"><span class="mno">NO. ${i+1} · ${String(2+i).padStart(2,'0')}/11/26</span>${m[0]?`<b class="mst">${m[0]}</b>`:''}<div class="mtw"><i class="rl"></i><p class="mt">${m[1]}</p></div><div class="msf">${m[2].map(t=>`<span>#${t}</span>`).join('')}</div></div></div>`).join('');
const sheets=()=>[...desk.querySelectorAll('.msh')];

function layout(){
 const W=desk.clientWidth;if(!W)return;
 const mob=W<560,cols=mob?2:W<900?3:4,gap=mob?4:6,sw=Math.floor((W-14-(cols-1)*gap)/cols);
 desk.style.setProperty('--sw',sw+'px');
 const colH=Array(cols).fill(16);let bottom=0;
 sheets().forEach(s=>{if(s.classList.contains('hide'))return;const i=+s.dataset.i,h=s.offsetHeight,p=POS[i];let x,y;
  if(p){x=p[0]/100*W;y=p[1]}else{let c=0;colH.forEach((v,k)=>{if(v<colH[c]-1)c=k});x=6+c*(sw+gap)+((i*37)%26)-13;y=colH[c]+((i*23)%14)-7;colH[c]+=h-26+((i*11)%12);s.style.zIndex=i+1}
  x=Math.max(0,Math.min(W-sw,x));y=Math.max(0,y);s.style.left=x+'px';s.style.top=y+'px';bottom=Math.max(bottom,y+h)});
 desk.style.minHeight=Math.max(bottom+40,mob?320:560)+'px'}

function filter(){
 const ql=Q.trim().toLowerCase();let n=0;
 sheets().forEach(s=>{const m=M[+s.dataset.i],ok=(!TAG||m[2].includes(TAG))&&(!ql||(m[0]+' '+m[1]+' '+m[2].join(' ')).toLowerCase().includes(ql));s.classList.toggle('hide',!ok);if(ok)n++});
 $('#sct').textContent=(Q||TAG)?`${n}/${M.length}`:M.length;layout()}
function chips(){$('#tg').innerHTML=`<button class="chip${TAG?'':' on'}" data-t="">${M.length}</button>`+tags.map(t=>`<button class="chip${TAG===t?' on':''}" data-t="${t}">#${t}</button>`).join('')}
$('#tg').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;TAG=b.dataset.t===TAG?'':b.dataset.t;chips();filter()};
$('#sq').oninput=e=>{Q=e.target.value;filter()};

function setV(k){cur=k;POS={};desk.className='mdk v-'+k;$('#vd').textContent=VD[k];$('#sw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));layout()}
$('#sw').insertAdjacentHTML('beforeend',Object.keys(V).map(k=>`<button data-k="${k}">${V[k]}</button>`).join(''));
$('#sw').onclick=e=>{const b=e.target.closest('button');if(b)setV(b.dataset.k)};
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};

/* drag (mouse: 5px move; touch: long-press 300ms) */
let MD=null,SUP=false;
desk.addEventListener('pointerdown',e=>{const s=e.target.closest('.msh');if(!s||e.button>0)return;const r=s.getBoundingClientRect();
 MD={s,ox:e.clientX-r.left,oy:e.clientY-r.top,x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',active:false,t:null};
 if(MD.touch)MD.t=setTimeout(()=>{if(MD){MD.active=true;s.classList.add('dragging');s.style.zIndex=++Z}},300)});
document.addEventListener('pointermove',e=>{if(!MD)return;const m=Math.hypot(e.clientX-MD.x0,e.clientY-MD.y0);
 if(!MD.active){if(MD.touch){if(m>8){clearTimeout(MD.t);MD=null}return}if(m>5){MD.active=true;MD.s.classList.add('dragging');MD.s.style.zIndex=++Z}else return}
 const dr=desk.getBoundingClientRect();let x=e.clientX-dr.left-MD.ox,y=e.clientY-dr.top-MD.oy;
 x=Math.max(0,Math.min(dr.width-MD.s.offsetWidth,x));y=Math.max(0,y);MD.s.style.left=x+'px';MD.s.style.top=y+'px';
 const need=y+MD.s.offsetHeight+40;if(need>desk.offsetHeight)desk.style.minHeight=need+'px';
 if(e.clientY<70)scrollBy(0,-14);else if(e.clientY>innerHeight-70)scrollBy(0,14)});
document.addEventListener('touchmove',e=>{if(MD&&MD.active)e.preventDefault()},{passive:false});
const end=()=>{const g=MD;MD=null;if(!g)return;clearTimeout(g.t);g.s.classList.remove('dragging');
