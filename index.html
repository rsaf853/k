<style>
:root{--ac:#ff7ebd;--bg:#fff;--fg:#000;--mut:#9a9a9a;--line:#e4e4e4;--soft:#f6f6f6;--sans:"Pretendard JP Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
:root[data-theme=dark]{--ac:#ffc9e7;--bg:#000;--fg:#fff;--mut:#777;--line:#2a2a2a;--soft:#111}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ac:#ffc9e7;--bg:#000;--fg:#fff;--mut:#777;--line:#2a2a2a;--soft:#111}}
*{box-sizing:border-box;border-radius:0}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);letter-spacing:-.03em;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;letter-spacing:inherit}a{color:inherit}
.wrap{max-width:1014px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);border-bottom:2px solid var(--fg);z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:44px}
.logo{font-weight:800;font-size:16px;text-decoration:none}
nav{display:flex;gap:2px;align-items:center}
nav a,nav button{font-size:14px;font-weight:600;text-decoration:none;color:var(--mut);padding:3px 6px;border:0;background:none;cursor:pointer}
nav a.on{color:var(--fg);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
nav a:hover,nav button:hover{color:var(--fg)}nav button svg{display:block}
main{padding:24px 0 56px;min-height:70vh}
h1{font-size:22px;font-weight:800;letter-spacing:-.05em;margin:0 0 2px}
.sub{color:var(--mut);font:500 11px/1.5 var(--sans);margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.btn,.chip{font:600 11px/1.5 var(--sans);border:1px solid var(--line);background:none;color:var(--fg);padding:3px 9px;cursor:pointer;text-decoration:none}
.btn:hover,.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip{color:var(--mut)}.chip:hover{color:var(--fg);border-color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.tg{font-size:11px;color:var(--mut);cursor:pointer;margin-right:6px}.tg:hover{color:var(--ac)}
.vb{font:700 9px/1 var(--sans);border:1px solid var(--fg);padding:2px 4px;margin-left:6px;vertical-align:middle}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 10px;outline:none;margin-bottom:6px}
input:focus,select:focus,textarea:focus{border-color:var(--fg)}
#sq{margin-bottom:10px}#q{margin-bottom:8px}textarea{min-height:140px;resize:vertical}label{display:block;font:600 11px var(--sans);color:var(--mut);margin:8px 0 3px}
.row{display:flex;gap:12px;align-items:baseline;border-bottom:1px solid var(--line);padding:10px 0;text-decoration:none}
.row:hover b{text-decoration:underline}.row b{font-weight:800;flex:1;min-width:0}.row small{color:var(--mut);font-size:11px}
.mas{column-width:211px;column-gap:10px}
.gi{break-inside:avoid;margin-bottom:10px;border:1px solid var(--line);position:relative;cursor:zoom-in}
.gi:hover{border-color:var(--fg)}.gi img{width:100%;display:block;-webkit-user-drag:none}
.gi .cp{padding:6px 9px;font-size:12px;border-top:1px solid var(--line)}
.lk{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--mut);font-weight:800;cursor:pointer}
.eb{position:absolute;top:6px;right:6px;background:var(--bg);border:1px solid var(--fg);font:700 10px/1 var(--sans);padding:4px 7px;cursor:pointer}
.mm{break-inside:avoid;border:1px solid var(--line);border-left:3px solid var(--fg);padding:10px 12px;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.mm b{display:block;font-weight:800;margin-bottom:4px}.mm .ft{margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--mut)}
.ln{display:flex;gap:14px;padding:7px 0;border-left:2px solid var(--ac);padding-left:12px;margin-left:4px;position:relative}
.ln time{flex:none;width:92px;font-size:11px;color:var(--mut);padding-top:2px}.ln span.t{flex:1;white-space:pre-wrap;word-break:break-word}
#md,#lb{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#md[hidden],#lb[hidden]{display:none}
.mb{background:var(--bg);border:2px solid var(--fg);padding:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.mb h3{margin:0 0 8px;font-size:14px;font-weight:800}.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
#lb img{max-width:100%;max-height:100%}
footer{border-top:1px solid var(--line);padding:14px 0;font-size:11px;color:var(--mut)}footer .wrap{display:flex;gap:8px;align-items:center}
#adm{border:0;background:none;color:inherit;padding:4px;cursor:default;display:inline-flex}#adm.on{color:var(--ac)}
/* reader */
.rtool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.set{display:none;border:1px solid var(--line);padding:10px;margin-bottom:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 14px}.set.on{display:grid}
.set input[type=range]{accent-color:var(--ac);padding:0;border:0;margin:0}
.bk{overflow:hidden;height:calc(100svh - 215px);min-height:320px}
.pg{height:100%;column-fill:auto;transition:transform .28s ease;font-family:var(--rf);font-size:var(--rs);line-height:var(--rl);letter-spacing:var(--rc);word-break:keep-all;overflow-wrap:break-word}
.pg>:first-child{margin-top:0}.pg h1{font-size:1.7em;letter-spacing:inherit;margin:0 0 .8em}.pg h2,.pg h3{margin:1.2em 0 .5em;break-after:avoid}
.pg p{margin:0 0 .9em}.pg img{max-width:100%;max-height:70%;break-inside:avoid}.pg blockquote{margin:1em 0;padding-left:1em;border-left:3px solid var(--fg);color:var(--mut)}
.pg pre,.pg code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:var(--soft)}.pg pre{padding:10px;overflow:auto;break-inside:avoid}
.pg hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
.pn{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
</style>
</head>

<nav><a href="#/posts" data-n="posts">archive</a><a href="#/gallery" data-n="gallery">img</a><a href="#/memo" data-n="memo">memo</a><a href="#/lines" data-n="lines">txt</a><button id="theme" aria-label="테마">◐</button></nav></div></header>

<script>
const SB_URL='https://pqktacursqpgmdyxwlxm.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxa3RhY3Vyc3FwZ21keXh3bHhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI5OTQ1NzAsImV4cCI6MjEwODU3MDU3MH0.TPlYNV9t5EkhkYKTDank8nQp8BUnWs6ge9nOVaHgQN8';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND={posts:'post',gallery:'gallery',memo:'memo',lines:'line'},LBL={post:'archive',gallery:'img',memo:'memo',line:'txt'};
let admin=false,ITEMS=[],TAG='',UNL={};
const date=(d,t)=>{const x=new Date(d),p=n=>String(n).padStart(2,'0');return`${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`+(t?` ${p(x.getHours())}:${p(x.getMinutes())}`:'')};
const G=i=>UNL[i.id]?{...i,...UNL[i.id]}:i,locked=i=>i.visibility==='locked'&&!admin&&!UNL[i.id];
const vb=i=>i.visibility==='public'?'':`<span class="vb">${i.visibility==='private'?'PRIVATE':'LOCKED'}</span>`;
const tags=i=>(i.tags||[]).map(t=>`<span class="tg" data-tag="${esc(t)}">#${esc(t)}</span>`).join('');
const eb=i=>admin?`<button class="btn" data-ed="${i.id}">EDIT</button>`:'';
const openM=h=>{$('#mb').innerHTML=h;$('#md').hidden=false},closeM=()=>$('#md').hidden=true;
$('#md').onclick=e=>{if(e.target.id==='md')closeM()};$('#lb').onclick=()=>$('#lb').hidden=true;
const msg=t=>{const e=$('#st');if(e)e.textContent=t};
/* theme */
const SUN='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',MOON='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
const isDark=()=>{const r=document.documentElement;return r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
const paintTheme=()=>{const d=isDark(),b=$('#theme'),t=d?'라이트 모드로 전환':'다크 모드로 전환';b.innerHTML=d?MOON:SUN;b.setAttribute('aria-label',t);b.title=t};
$('#theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}paintTheme()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paintTheme);paintTheme();
/* data */
async function load(){const r=await sb.from(admin?'items':'feed').select('*').order('created_at',{ascending:false});ITEMS=r.data||[];return!r.error||(app.innerHTML='<p>불러오기 실패: '+esc(r.error.message)+'</p>',false)}
function unlock(id){openM(`<h3>LOCKED</h3><form id="f"><input type="password" name="pw" placeholder="비밀번호" autofocus required><p id="st" class="sub"></p><div class="acts"><button type="button" class="btn" data-x>CANCEL</button><button class="btn">UNLOCK</button></div></form>`);
 $('#f').onsubmit=async e=>{e.preventDefault();const r=await sb.rpc('unlock',{p_id:id,p_pw:new FormData(e.target).get('pw')});if(r.error||!r.data?.length)return msg('비밀번호가 맞지 않아요');UNL[id]=r.data[0];closeM();route()}}
/* reader */
marked.use({breaks:true,renderer:{code(c,l){return(l||'').trim()==='html'?c:false}}});
const FONTS={pre:'"Pretendard JP Variable",Pretendard,sans-serif',bat:'"KoPubWorld Batang","Noto Serif KR",serif',kg:'"KoPubWorld Dotum",Pretendard,sans-serif',tnr:'"Times New Roman",Times,"Noto Serif KR",serif',nw:'Newsreader,"Noto Serif KR",serif',rb:'Roboto,Pretendard,sans-serif'};
const FN={pre:'프리텐다드',bat:'KoPub 바탕',kg:'KoPub 고딕',tnr:'Times New Roman',nw:'Newsreader',rb:'Roboto'};
let RS={f:'bat',s:17,l:1.8,c:-.01};try{Object.assign(RS,JSON.parse(localStorage.getItem('rs')||'{}'))}catch(e){}
let pI=0,pN=1;const GAP=48;
function applyRS(){const p=$('#pg');if(!p)return;p.style.setProperty('--rf',FONTS[RS.f]);p.style.setProperty('--rs',RS.s+'px');p.style.setProperty('--rl',RS.l);p.style.setProperty('--rc',RS.c+'em');try{localStorage.setItem('rs',JSON.stringify(RS))}catch(e){}layout()}
function layout(){const b=$('#bk'),p=$('#pg');if(!b)return;const two=matchMedia('(min-width:900px) and (orientation:landscape)').matches;p.style.columnCount=two?2:1;p.style.columnGap=GAP+'px';p.style.height=b.clientHeight+'px';pN=Math.max(1,Math.round((p.scrollWidth+GAP)/(b.clientWidth+GAP)));go(pI)}
function go(i){pI=Math.max(0,Math.min(pN-1,i));$('#pg').style.transform=`translateX(${-pI*($('#bk').clientWidth+GAP)}px)`;$('#pi').textContent=`${pI+1} / ${pN}`}
function reader(it){const i=G(it);pI=0;
 app.innerHTML=`<a class="btn" href="#/posts">← BACK</a> ${eb(i)} <button class="btn" id="sb">Aa</button>
 <div class="set" id="set"><div><label>글꼴</label><select id="s-f">${Object.keys(FN).map(k=>`<option value="${k}"${RS.f===k?' selected':''}>${FN[k]}</option>`).join('')}</select></div>
 <div><label>크기 ${RS.s}px</label><input type="range" id="s-s" min="13" max="28" step="1" value="${RS.s}"></div>
 <div><label>줄간격 ${RS.l}</label><input type="range" id="s-l" min="1.3" max="2.6" step=".05" value="${RS.l}"></div>
 <div><label>자간 ${RS.c}em</label><input type="range" id="s-c" min="-.08" max=".12" step=".01" value="${RS.c}"></div></div>
 <div class="bk" id="bk" style="margin-top:12px"><div class="pg" id="pg"><h1>${esc(i.title)}</h1>${marked.parse(i.body||'')}</div></div>
 <div class="pn"><button class="btn" id="pv">← PREV</button><span class="sub" id="pi" style="margin:0"></span><button class="btn" id="nx">NEXT →</button></div>`;
 $('#sb').onclick=()=>$('#set').classList.toggle('on');
 for(const[k,id]of[['f','s-f'],['s','s-s'],['l','s-l'],['c','s-c']])$('#'+id).oninput=e=>{RS[k]=k==='f'?e.target.value:+e.target.value;if(k!=='f')e.target.previousElementSibling.textContent=e.target.previousElementSibling.textContent.replace(/[-\d.]+(px|em)?$/,RS[k]+(k==='s'?'px':k==='c'?'em':''));applyRS()};
 $('#pv').onclick=()=>go(pI-1);$('#nx').onclick=()=>go(pI+1);
 let x0;const b=$('#bk');b.ontouchstart=e=>x0=e.touches[0].clientX;b.ontouchend=e=>{const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>40)go(pI+(d<0?1:-1))};
 applyRS();document.fonts.ready.then(layout);b.querySelectorAll('img').forEach(m=>m.onload=layout)}
document.addEventListener('keydown',e=>{if($('#pg')&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')go(pI+1);if(e.key==='ArrowLeft')go(pI-1)}});
addEventListener('resize',layout);
/* views */
function head(k,t){return`<div class="top"><div><h1>${t}</h1><p class="sub">${ITEMS.filter(i=>i.kind===KIND[k]).length} ITEMS</p></div>${admin?`<button class="btn" data-new="${KIND[k]}">+ NEW</button>`:''}</div>`}
function chips(list){const all=[...new Set(list.flatMap(i=>i.tags||[]))].sort();return all.length?`<div class="bar"><button class="chip${TAG?'':' on'}" data-tag="">ALL</button>${all.map(t=>`<button class="chip${TAG===t?' on':''}" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`:''}
let Q='';
const match=i=>!Q||[i.title,i.body,(i.tags||[]).join(' ')].join(' ').toLowerCase().includes(Q.toLowerCase());
function list(k){const kind=KIND[k],L=ITEMS.filter(i=>i.kind===kind&&(!TAG||(i.tags||[]).includes(TAG))&&match(G(i)));let h='';
 if(kind==='post')h=L.map(i=>`<a class="row" href="#/post/${i.id}"><b>${esc(i.title)}${vb(i)}</b><span>${tags(i)}</span><small>${date(i.created_at)}</small></a>`).join('');
 if(kind==='gallery')h=`<div class="mas">${L.map(it=>{const i=G(it);return`<div class="gi" data-gi="${i.id}">${locked(i)?'<div class="lk">LOCKED</div>':`<img src="${esc(i.meta?.src)}" loading="lazy" alt="">`}${admin?`<button class="eb" data-ed="${i.id}">EDIT</button>`:''}${i.body||i.tags?.length?`<div class="cp">${esc(i.body||'')} ${tags(i)}${vb(i)}</div>`:''}</div>`}).join('')}</div>`;
 if(kind==='memo')h=`<div class="mas">${L.map(it=>{const i=G(it);return`<div class="mm">${i.title?`<b>${esc(i.title)}</b>`:''}${locked(i)?`<span data-un="${i.id}" style="cursor:pointer;color:var(--mut)">LOCKED — 클릭해서 열기</span>`:esc(i.body)}<div class="ft"><span>${tags(i)}${vb(i)} ${date(i.created_at)}</span>${eb(i)}</div></div>`}).join('')}</div>`;
 if(kind==='line')h=`<div style="margin-top:8px">${L.map(it=>{const i=G(it);return`<div class="ln"><time>${date(i.created_at,1)}</time><span class="t">${locked(i)?`<span data-un="${i.id}" style="cursor:pointer;color:var(--mut)">LOCKED</span>`:esc(i.body)} ${tags(i)}${vb(i)}</span>${eb(i)}</div>`}).join('')}</div>`;
 return L.length?h:'<p class="sub">비어 있어요</p>'}
function view(k){const kind=KIND[k],all=ITEMS.filter(i=>i.kind===kind);
 app.innerHTML=head(k,LBL[kind])+`<input id="sq" placeholder="검색 (제목 · 본문 · 태그)" value="${esc(Q)}" autocomplete="off">`+(kind==='line'&&admin?`<form id="q"><input name="t" placeholder="한 줄 입력 후 Enter (#태그 가능)" autocomplete="off"></form>`:'')+chips(all)+`<div id="lst">${list(k)}</div>`;
 $('#sq').oninput=e=>{Q=e.target.value;$('#lst').innerHTML=list(k)};
 const q=$('#q');if(q)q.onsubmit=async e=>{e.preventDefault();const t=new FormData(q).get('t').trim();if(!t)return;await save({kind:'line',body:t,tags:hash(t),visibility:'public'})}}
const hash=t=>[...t.matchAll(/(?:^|\s)#([^\s#]+)/g)].map(m=>m[1]);
function route(){const h=location.hash.replace('#/','')||'posts',[a,b]=h.split('/');document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.dataset.n===a||(a==='post'&&x.dataset.n==='posts')));
 if(a==='post'){const it=ITEMS.find(i=>i.id==b);if(!it){app.innerHTML='<p>없는 글이에요</p>';return}if(locked(it))return app.innerHTML=`<a class="btn" href="#/posts">← BACK</a><h1 style="margin-top:14px">${esc(it.title)}</h1><p><button class="btn" data-un="${it.id}">비밀번호 입력</button></p>`;return reader(it)}
 view(KIND[a]?a:'posts')}
/* admin forms */
function form(kind,it){const i=it||{visibility:'public',tags:[],meta:{}},new_=!it;
 openM(`<h3>${LBL[kind]} ${new_?'NEW':'EDIT'}</h3><form id="f">
 ${kind==='post'||kind==='memo'?`<label>제목</label><input name="title" value="${esc(i.title)}">`:''}
 ${kind==='gallery'?`<label>이미지 URL (여러 줄 가능)</label><textarea name="urls" style="min-height:60px">${esc(i.meta?.src||'')}</textarea>${new_?'<label>또는 파일 업로드</label><input type="file" name="files" accept="image/*" multiple>':''}<label>캡션</label><input name="body" value="${esc(i.body)}">`
 :`<label>${kind==='post'?'본문 (Markdown · ```html 블록은 그대로 삽입)':'내용'}</label>${kind==='line'?`<input name="body" value="${esc(i.body)}">`:`<textarea name="body" style="min-height:${kind==='post'?320:140}px;font-family:ui-monospace,monospace;font-size:12px">${esc(i.body)}</textarea>`}`}
 ${kind==='post'?'<button type="button" class="btn" id="up">+ 이미지 업로드</button><input type="file" id="upf" accept="image/*" multiple hidden>':''}
 <label>해시태그 (쉼표/공백 구분)</label><input name="tags" value="${esc((i.tags||[]).join(' '))}">
 <label>공개 설정</label><select name="vis">${[['public','공개'],['private','비밀글 (나만 보기)'],['locked','보호글 (비밀번호)']].map(([k,t])=>`<option value="${k}"${i.visibility===k?' selected':''}>${t}</option>`).join('')}</select>
 <input type="password" name="pw" placeholder="보호글 비밀번호 (바꿀 때만 입력)" autocomplete="new-password">
 <p id="st" class="sub"></p><div class="acts">${new_?'':'<button type="button" class="btn" data-del>DELETE</button>'}<button type="button" class="btn" data-x>CANCEL</button><button class="btn">SAVE</button></div></form>`);
 $('[data-del]')&&($('[data-del]').onclick=async()=>{if(!confirm('삭제할까요?'))return;const r=await sb.from('items').delete().eq('id',i.id);if(r.error)return msg(r.error.message);closeM();await load();location.hash=kind==='post'?'#/posts':location.hash;route()});
 $('#up')&&($('#up').onclick=()=>$('#upf').click(),$('#upf').onchange=async e=>{const ta=$('#f [name=body]');for(const f of e.target.files){msg('업로드 중…');const p=Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+f.name.replace(/[^\w.-]/g,'');const u=await sb.storage.from('img').upload(p,f);if(u.error)return msg('업로드 실패: '+u.error.message);ta.setRangeText(`\n![](${sb.storage.from('img').getPublicUrl(p).data.publicUrl})\n`,ta.selectionStart,ta.selectionEnd,'end')}msg('업로드 완료 — 본문에 삽입됐어요');e.target.value=''});
 $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);msg('저장 중…');
  const base={kind,title:fd.get('title')||null,tags:[...new Set([...(fd.get('tags')||'').split(/[,\s]+/).map(s=>s.replace(/^#/,'')).filter(Boolean),...(kind==='memo'||kind==='line'?hash(fd.get('body')||''):[])])],visibility:fd.get('vis')};
  const pw=fd.get('pw');if(base.visibility==='locked'&&new_&&!pw)return msg('보호글은 비밀번호가 필요해요');
  if(kind==='gallery'){const srcs=(fd.get('urls')||'').split('\n').map(s=>s.trim()).filter(Boolean);
   for(const f of fd.getAll('files')){if(!f.size)continue;const p=Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+f.name.replace(/[^\w.-]/g,'');const u=await sb.storage.from('img').upload(p,f);if(u.error)return msg('업로드 실패: '+u.error.message);srcs.push(sb.storage.from('img').getPublicUrl(p).data.publicUrl)}
   if(!srcs.length)return msg('이미지를 넣어주세요');
   if(!new_)return save({...base,body:fd.get('body'),meta:{src:srcs[0]}},i.id,pw);
   for(const s of srcs)await save({...base,body:fd.get('body'),meta:{src:s}},null,pw,1);return done()}
  save({...base,body:fd.get('body')},i.id,pw)}}
async function save(row,id,pw,quiet){const r=id?await sb.from('items').update(row).eq('id',id).select('id').single():await sb.from('items').insert(row).select('id').single();
 if(r.error)return msg('저장 실패: '+r.error.message);if(pw)await sb.rpc('set_pw',{p_id:r.data.id,p_pw:pw});if(!quiet)done()}
async function done(){closeM();await load();route()}
/* events */
document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest(s);
 if(c('[data-x]'))return closeM();
 let x;if(x=c('[data-tag]')){TAG=x.dataset.tag===TAG?'':x.dataset.tag;return route()}
 if(x=c('[data-new]'))return form(x.dataset.new);
 if(x=c('[data-ed]')){e.stopPropagation();const i=ITEMS.find(i=>i.id==x.dataset.ed);return form(i.kind,G(i))}
 if(x=c('[data-un]'))return unlock(+x.dataset.un);
 if(x=c('[data-gi]')){const i=G(ITEMS.find(i=>i.id==x.dataset.gi));if(locked(i))return unlock(i.id);$('#lb').innerHTML=`<img src="${esc(i.meta.src)}" alt="">`;$('#lb').hidden=false}});
addEventListener('hashchange',()=>{TAG='';Q='';route()});
/* auth */
const sync=()=>$('#adm').classList.toggle('on',admin);
$('#adm').onclick=async()=>{if(admin){await sb.auth.signOut();return}
 openM(`<h3>ADMIN LOGIN</h3><form id="f"><label>이메일</label><input type="email" name="email" required autocomplete="username"><label>비밀번호</label><input type="password" name="pw" required autocomplete="current-password"><p id="st" class="sub"></p><div class="acts"><button type="button" class="btn" data-x>CANCEL</button><button class="btn">LOGIN</button></div></form>`);
 $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);msg('로그인 중…');const r=await sb.auth.signInWithPassword({email:fd.get('email'),password:fd.get('pw')});if(r.error)return msg('실패: '+r.error.message);closeM()}};
sb.auth.onAuthStateChange(async(_,s)=>{const was=admin;admin=!!s;sync();if(was!==admin&&ITEMS.length+1){UNL={};if(await load())route()}});
(async()=>{const{data}=await sb.auth.getSession();admin=!!data.session;sync();if(await load())route()})();
</script>
</body>
</html>
