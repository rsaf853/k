 PUZ.data=data;PUZ.board=PUZ.start.board;PUZ.last=PUZ.start.last;PUZ.hist=PUZ.start.hist.slice();PUZ.hist0=PUZ.start.hist0;PUZ.solN=0;PUZ.side=PUZ.board.turn;PUZ.cursor=0;PUZ.selected=-1;PUZ.legal=[];PUZ.hint=0;PUZ.hintSq=[];PUZ.bad=-1;PUZ.solved=false;PUZ.busy=false;PUZ.daily=daily;PUZ.loading=false;PUZ.flip=false;PUZ.feedback=note||'';puzRender()}
function puzzlePage(){puzLoad(true)}

/* memo viewer */
function memoView(id){const it=ITEMS.find(i=>i.id==id);if(!it)return;const i=G(it);if(locked(i))return unlock(i.id);
 openM(`${i.title?`<p style="font-weight:700;font-size:16px;margin:0 0 8px">${esc(i.title)}</p>`:''}<div class="mfull md">${mdm(i.body)}</div><p class="st" style="margin-top:12px">${tags(i)}${vb(i)} ${date(i.created_at,1)}</p><div class="acts">${admin?`<button class="btn" data-ed="${i.id}">EDIT</button>`:''}<button class="btn" data-x>CLOSE</button></div>`)}
/* forms (memo / line / gallery) */
function form(kind,it){if(kind==='post'||kind==='log'){closeM();return editor(it,kind)}const i=it||{visibility:'public',tags:[],meta:{}},nw=!it;
 openM(`<h3>${LBL[kind].toUpperCase()} ${nw?'NEW':'EDIT'}</h3><form id="f">
 ${kind==='memo'||kind==='log'?`<label>Title</label><input name="title" value="${esc(i.title)}">`:''}
 ${kind==='gallery'?`<label>Image URL (one per line)</label><textarea name="urls">${esc(i.meta?.src||'')}</textarea>${nw?'<label>or upload files</label><input type="file" name="files" accept="image/*" multiple>':''}<label>Caption</label><input name="body" value="${esc(i.body)}">`:`<label>Content${kind==='line'||kind==='memo'||kind==='log'?' (markdown)':''}</label><textarea name="body" style="min-height:${kind==='line'?110:kind==='log'?280:140}px">${esc(i.body)}</textarea>`}
 ${kind==='line'||kind==='log'?`<label>Date</label><input type="datetime-local" name="dt" value="${nw?'':loc(i.created_at)}">`:''}
  <label>Tags (space separated)</label><input name="tags" value="${esc((i.tags||[]).join(' '))}">
 <label>Visibility</label><select name="vis">${[['public','Public'],['private','Private'],['locked','Locked']].map(([k,t])=>`<option value="${k}"${i.visibility===k?' selected':''}>${t}</option>`).join('')}</select>
 <input type="password" name="pw" placeholder="password" autocomplete="new-password" style="margin-top:6px">
 <p id="st" class="st"></p><div class="acts">${nw?'':'<button type="button" class="btn" data-del>DELETE</button>'}<button type="button" class="btn" data-x>CANCEL</button><button class="btn">SAVE</button></div></form>`);
 if($('[data-del]'))$('[data-del]').onclick=async()=>{if(!confirm('Delete?'))return;const r=await sb.from('items').delete().eq('id',i.id);if(r.error)return msg(r.error.message);closeM();await load();route()};
 $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);msg('Saving…');
  const base={kind,title:fd.get('title')||null,tags:[...new Set([...(fd.get('tags')||'').split(/[,\s]+/).map(s=>s.replace(/^#/,'')).filter(Boolean),...(kind==='memo'||kind==='line'?hash(fd.get('body')||''):[])])],visibility:fd.get('vis')},pw=fd.get('pw');
  if((kind==='line'||kind==='log')&&fd.get('dt'))base.created_at=new Date(fd.get('dt')).toISOString();
   if(base.visibility==='locked'&&nw&&!pw)return msg('Locked items need a password');
  if(kind==='gallery'){const srcs=(fd.get('urls')||'').split('\n').map(s=>s.trim()).filter(Boolean);
   try{for(const f of fd.getAll('files')){if(f.size)srcs.push(await upload(f))}}catch(x){return msg('Upload failed: '+x.message)}
   if(!srcs.length)return msg('Add an image');
   if(!nw)return save({...base,body:fd.get('body'),meta:{src:srcs[0]}},i.id,pw);
   for(const s of srcs)await save({...base,body:fd.get('body'),meta:{src:s}},null,pw,1);return done()}
  save({...base,body:fd.get('body')},i.id,pw)}}
async function save(row,id,pw,quiet){try{const r=id?await sb.from('items').update(row).eq('id',id).select('id').single():await sb.from('items').insert(row).select('id').single();
 if(r.error)return msg('Save failed: '+r.error.message);if(pw)await sb.rpc('set_pw',{p_id:r.data.id,p_pw:pw});if(!quiet)await done()}catch(x){msg('Save failed: '+(x.message||x))}}
async function done(){closeM();await load();route()}
/* events */
document.addEventListener('pointerdown',e=>{if(e.target.closest('.br2')){e.preventDefault();const sel=getSelection();if(sel)sel.removeAllRanges()}},true);
document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest(s);let x;
 const s2=$('#sh2');if(s2&&s2.classList.contains('on')&&!c('#sh2')&&!c('#aa2'))s2.classList.remove('on');
 if(c('#sh2')){const b=t.closest('#sh2 button');if(b){rsClick(b);s2.innerHTML=sheet(false);applyRS()}return}
 if(c('#aa2')){s2.classList.toggle('on');return}
 if(c('#fsb')){FS=true;return route()}
 if(x=c('[data-pp]')){e.preventDefault();const sel=getSelection();if(sel)sel.removeAllRanges();return go2(p2I+ +x.dataset.pp)}
 if(c('[data-xfs]')){FS=false;closeReader();if(!$('#ar'))route();return}
 if(c('[data-x]'))return closeM();
 if(x=c('[data-cfg]')){CFG[x.dataset.cfg]=+x.dataset.v;try{localStorage.setItem('cfg',JSON.stringify(CFG))}catch(e){}applyCols();return settings()}
 if(x=c('[data-tg2]')){const[tg,h]=x.dataset.tg2.split('|');PEND=tg;location.hash=h;return}
 if(x=c('[data-rp],[data-rj],[data-pz]')){const bl=x.closest('[data-b]'),b=bl&&HOME.blocks.find(q=>q.id===bl.dataset.b);if(!b)return;
  if(x.dataset.pz!==undefined){const L=pzList(b),st=PZ[b.id]||(PZ[b.id]={i:dayN()%L.length,s:0});if(x.dataset.pz==='s')st.s=st.s?0:1;else{st.i=(st.i+1)%L.length;st.s=0}x.closest('.pz').outerHTML=pzHtml(b);return}
  const L=repList(b),st=RP[b.id]||(RP[b.id]={g:dayN()%L.length,p:0}),n=repGame(L[st.g%L.length][1]).M.length;
  if(x.dataset.rj)st.p=+x.dataset.rj;else{const o=x.dataset.rp;if(o==='s')st.p=0;if(o==='-')st.p=Math.max(0,st.p-1);if(o==='+')st.p=Math.min(n,st.p+1);if(o==='e')st.p=n;if(o==='g'){st.g=(st.g+1)%L.length;st.p=0}}
  x.closest('.rep').outerHTML=repHtml(b);return}
 if(x=c('[data-rr]')){const a=pub('line');if(a.length)x.closest('.tl').outerHTML=tlInner(a[Math.floor(Math.random()*a.length)],true);return}
 if(x=c('[data-tag]')){TAG=x.dataset.tag===TAG?'':x.dataset.tag;return route()}
 if(x=c('[data-new]'))return form(x.dataset.new);
 if(x=c('[data-ed]')){e.stopPropagation();const i=ITEMS.find(i=>i.id==x.dataset.ed);return form(i.kind,G(i))}
 if(x=c('[data-un]'))return unlock(+x.dataset.un);
 if(e.target.closest('.mt a,.mfull a'))return;
 if(x=c('[data-mv]'))return memoView(x.dataset.mv);
 if(x=c('[data-gi]')){const i=G(ITEMS.find(i=>i.id==x.dataset.gi));if(locked(i))return unlock(i.id);$('#lb').innerHTML=`<figure><img src="${esc(i.meta.src)}" alt="">${i.body?`<figcaption>${esc(i.body)}</figcaption>`:''}</figure>`;$('#lb').hidden=false;return}
 if(x=c('[data-d]')){CAL.sel=x.dataset.d;return paintCal()}
 if(x=c('[data-cm]')){const d=+x.dataset.cm;if(!d){CAL.y=now.getFullYear();CAL.m=now.getMonth();CAL.sel=TODAY}else{const n=new Date(CAL.y,CAL.m+d,1);CAL.y=n.getFullYear();CAL.m=n.getMonth()}return paintCal()}
 if(x=c('[data-pdel]')){const id=+x.dataset.pdel;sb.from('plans').delete().eq('id',id).then(r=>{if(r.error)return alert(r.error.message);PLANS=PLANS.filter(p=>p.id!==id);paintCal()});return}
 if(x=c('[data-pk]')){const p=PLANS.find(p=>p.id==x.dataset.pk);p.done=!p.done;paintCal();sb.from('plans').update({done:p.done}).eq('id',p.id).then(r=>r.error&&alert(r.error.message));return}
 if(x=c('[data-pa]')){AK=x.dataset.pa;return paintCal()}
 if(c('[data-pack]')){if(GM.n!==12)return;const it=Object.entries(LAY).map(([id,p])=>({id,...p})).sort((a,b)=>a.y-b.y||a.x-b.x),R=[];
  it.forEach(t=>{let y=0;while(R.some(r=>t.x<r.x+r.w&&t.x+t.w>r.x&&y<r.y+r.h&&y+t.h>r.y))y++;R.push({x:t.x,y,w:t.w,h:t.h});const b=HOME.blocks.find(q=>q.id===t.id);if(b){b.x=t.x;b.y=y}});
  masonry();gridCommit();saveHome();return home()}
 if(c('[data-em]')){if(EDITM&&GM.n===12&&innerWidth>720){gridCommit();saveHome()} /* DONE = lock the current grid layout */
  EDITM=!EDITM;return home()}
 if(c('[data-addb]')){openM(`<h3>ADD BLOCK</h3><div class="pk">${Object.keys(BT).filter(t=>t!=='banners'&&(t!=='calendar'||!HOME.blocks.some(b=>b.t==='calendar'))).map(t=>`<button class="btn" data-pick="${t}">${BT[t]}</button>`).join('')}</div>`);return}
 if(x=c('[data-pick]')){const t=x.dataset.pick,b={id:uid(),t,w:t==='banners'?2:1,s:t==='banners'?12:6,n:t==='tags'?24:t==='pgn'?12:6};HOME.blocks.push(b);saveHome();closeM();home();if(['image','note','links','position','puzzle','replay','banners'].includes(t))blockForm(b);return}
 if(c('[data-himg]')){const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{if(!f.files[0])return;try{HOME.img=await upload(f.files[0]);await saveHome();paintImg()}catch(x){alert('Upload failed: '+x.message)}};f.click();return}
 if(c('[data-iadj]'))return imgAdjust();
 if(c('[data-ireset]')){Object.assign(HOME,IMG_DEF);paintVars();document.querySelectorAll('[data-ia]').forEach(s=>{s.value=HOME[s.dataset.ia];$('#v_'+s.dataset.ia).textContent=s.value+IU[s.dataset.ia]});return}
 if(c('[data-isave]')){ADJ=null;saveHome();closeM();return}
 if(x=c('[data-bm]')){const id=x.closest('[data-b]').dataset.b,B=HOME.blocks,i=B.findIndex(b=>b.id===id),b=B[i],op=x.dataset.bm;
  if(op==='up'||op==='dn'||op==='c'){if(GM.n!==12||!LAY[id])return alert('Widen the window to edit the grid.');
   return gridDo(id,q=>{const p=LAY[id];if(op==='c'){q.s=+x.dataset.c;delete q.c;q.w=q.s===12?2:1}else{q.x=p.x;q.y=Math.max(0,p.y+(op==='up'?-1:1))}})}
  if(op==='v')b.v=b.v==='pc'?'m':b.v==='m'?'':'pc';
  if(op==='rm'){if(!confirm('Delete this block?'))return;B.splice(i,1)}if(op==='ed')return blockForm(b);saveHome();home()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pi'&&e.target.value.trim()){const v=e.target.value.trim();e.target.value='';planAdd(v)}});
{let t=0;addEventListener('scroll',()=>{const h=document.documentElement.classList;h.add('sb');clearTimeout(t);t=setTimeout(()=>h.remove('sb'),900)},{capture:true,passive:true})} /* show scrollbars only while scrolling */
addEventListener('hashchange',()=>{TAG=PEND;PEND='';Q='';FS=false;scrollTo(0,0);route()});

/* auth */
const sync=()=>{$('#adm').classList.toggle('on',admin);const m=$('#mode');m.textContent=EM?'stalemate':'checkmate';m.classList.toggle('ok',admin);m.classList.toggle('on',admin&&EM);$('#cfg').style.display=em()?'':'none'};
$('#mode').onclick=()=>{if(!admin)return;EM=!EM;if(!EM)EDITM=false;sync();paintImg();route()};
$('#adm').onclick=async()=>{if(admin){await sb.auth.signOut();return}
 openM(`<h3>ADMIN LOGIN</h3><form id="f"><label>Email</label><input type="email" name="email" required autocomplete="username"><label>Password</label><input type="password" name="pw" required autocomplete="current-password"><p id="st" class="st"></p><div class="acts"><button type="button" class="btn" data-x>CANCEL</button><button class="btn">LOGIN</button></div></form>`);
 $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);msg('Signing in…');const r=await sb.auth.signInWithPassword({email:fd.get('email'),password:fd.get('pw')});if(r.error)return msg('Failed: '+r.error.message);closeM()}};
/* NOTE: never await supabase calls inside this callback (deadlocks the auth lock -> whole site freezes). Defer with setTimeout. */
sb.auth.onAuthStateChange((ev,s)=>{const was=admin;admin=!!s;if(!admin){EDITM=false;EM=false}sync();
 if(ev==='INITIAL_SESSION'||was===admin)return;
 setTimeout(async()=>{UNL={};if(await load())route()},0)});
(async()=>{try{const{data}=await sb.auth.getSession();admin=!!data.session;sync();if(await load())route()}catch(x){app.innerHTML='<p class="empty">Load failed: '+esc(x.message||x)+'</p>'}})();
